<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">

        <!-- Google Web Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Raleway:wght@600;800&display=swap" rel="stylesheet">

        <!-- Icon Font Stylesheet -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

        <!-- Stylesheets -->
        <link rel="stylesheet" th:href="@{/css/dashmix.css}">
    </head>
    <body>
        <!-- Page Container -->
        <div id="page-container">
            <main id="main-container">
                <div class="bg-image" th:style="'background-image: url(' + @{/img/dhsg.jpg} + ');'">
                    <div class="row g-0 bg-primary-op">
                        <div class="hero-static col-md-6 d-flex align-items-center bg-body-extra-light">
                            <div class="p-3 w-100">
                                <!-- Header -->
                                <div class="mb-3 text-center">
                                    <a class="link-fx fw-bold fs-1">
                                        <span class="text-dark">SG</span><span class="text-primary">U</span>
                                    </a>
                                    <p class="text-uppercase fw-bold fs-sm text-muted">Đăng nhập</p>
                                </div>

                                <!-- Sign In Form -->
                                <div class="row g-0 justify-content-center">
                                    <div class="col-sm-8 col-xl-6">
                                        <form class="js-validation-signin" th:action="@{/login}" method="POST">
                                            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                                            <div class="py-3">
                                                <div class="mb-4">
                                                    <input type="text" class="form-control form-control-lg form-control-alt" 
                                                           id="login-username" name="login-username" placeholder="Username">
                                                </div>
                                                <div class="mb-4">
                                                    <input type="password" class="form-control form-control-lg form-control-alt" 
                                                           id="login-password" name="login-password" placeholder="Password">
                                                </div>
                                            </div>
                                            <div class="mb-4">
                                                <button type="submit" class="btn w-100 btn-lg btn-hero btn-primary">
                                                    <i class="fa fa-fw fa-sign-in-alt opacity-50 me-1"></i> Đăng nhập
                                                </button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- JS -->
        <script th:src="@{/js/jquery.min.js}"></script>
        <script th:src="@{/js/jquery.validate.min.js}"></script>
        <script th:src="@{/js/dashmix.app.min.js}"></script>
        <script th:src="@{/js/op_auth_signin.js}"></script>
    </body>
</html>
