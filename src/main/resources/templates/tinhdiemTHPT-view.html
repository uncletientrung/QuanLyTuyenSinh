<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="fragments/head :: head"></head>
    <body>
        <div id="page-container" class="page-header-dark main-content-boxed">
            <main id="main-container">
                <div th:replace="fragments/nav :: nav"></div>

                <div class="content">
                    <div class="block block-rounded">
                        <div class="block-header block-header-default">
                            <h3 class="block-title">Công cụ tham khảo tính điểm xét tuyển</h3>
                        </div>
                        <div class="block-content">
                            <form class="js-validation-thpt" th:action="@{/tinhdiemTHPT}" method="POST">

                                <!-- Basic Elements -->
                                <h2 class="content-heading pt-0">Điểm môn <span class="fw-bold text-primary">
                                        THPT</span></h2>

                                <div class="row push">
                                    <!-- Cột trái: Thông tin chung -->
                                    <div class="col-lg-4">
                                        <div class="mb-4">
                                            <label class="form-label" for="nganh-select">Chọn ngành:</label>
                                            <select class="form-select" id="nganh-select" name="nganh">
                                                <option value="">-- Chọn ngành --</option>
                                                <!-- Vòng lặp for của thymeleaf -->
                                                <option th:each="nganh : ${listNganh}"  
                                                        th:value="${nganh.manganh}" 
                                                        th:text="${nganh.manganh + ' - ' + nganh.tennganh}"
                                                        th:selected="${nganh.manganh == selectedNganh}">
                                                </option>
                                            </select>
                                        </div>

                                        <div class="mb-4">
                                            <label class="form-label" for="diem-cong-input">Điểm cộng (<span class="fw-bold text-primary">&le; 3.0</span>):</label>
                                            <input type="number" step="0.1" min="0" max="3" class="form-control" id="diem-cong-input" 
                                                   name="diemCong" value="0" placeholder="0.0">
                                        </div>

                                        <div class="mb-4">
                                            <label class="form-label" for="khuvuc-select">Khu vực ưu tiên:</label>
                                            <select class="form-select" id="khuvuc-select" name="khuVuc">
                                                <option value="0" selected>Không có</option>
                                                <option value="1">Khu vực 1</option>
                                                <option value="2">Khu vực 2</option>
                                                <option value="2NT">Khu vực 2 nông thôn</option>
                                                <option value="3">Khu vực 3</option>
                                            </select>
                                        </div>

                                        <div class="mb-4">
                                            <label class="form-label" for="doituong-select">Đối tượng ưu tiên:</label>
                                            <select class="form-select" id="doituong-select" name="doiTuong">
                                                <option value="0" selected>Không đối tượng</option>
                                                <option value="01">Đối tượng 01</option>
                                                <option value="02">Đối tượng 02</option>
                                                <option value="03">Đối tượng 03</option>
                                                <option value="04">Đối tượng 04</option>
                                                <option value="05">Đối tượng 05</option>
                                                <option value="06">Đối tượng 06</option>
                                                <option value="07">Đối tượng 07</option>
                                            </select>
                                        </div>
                                    </div>

                                    <!-- Cột phải: Điểm các môn -->
                                    <div class="col-lg-8">
                                        <div class="row">
                                            <div class="col-md-6">
                                                <div class="mb-3">
                                                    <label class="form-label" for="diem-toan">Điểm môn Toán:</label>
                                                    <input type="number" step="0.01" min="0" max="10" class="form-control" 
                                                           id="diem-toan" name="toan" value="0">
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label" for="diem-van">Điểm môn Ngữ văn:</label>
                                                    <input type="number" step="0.01" min="0" max="10" class="form-control" 
                                                           id="diem-van" name="nguVan" value="0">
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label" for="diem-ly">Điểm môn Vật lý:</label>
                                                    <input type="number" step="0.01" min="0" max="10" class="form-control" 
                                                           id="diem-ly" name="vatLy" value="0">
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label" for="diem-hoa">Điểm môn Hóa học:</label>
                                                    <input type="number" step="0.01" min="0" max="10" class="form-control" 
                                                           id="diem-hoa" name="hoaHoc" value="0">
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label" for="diem-sinh">Điểm môn Sinh học:</label>
                                                    <input type="number" step="0.01" min="0" max="10" class="form-control" 
                                                           id="diem-sinh" name="sinhHoc" value="0">
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label" for="diem-anh">Điểm môn Tiếng Anh:</label>
                                                    <input type="number" step="0.01" min="0" max="10" class="form-control" 
                                                           id="diem-anh" name="tiengAnh" value="0">
                                                </div>
                                            </div>

                                            <div class="col-md-6">
                                                <div class="mb-3">
                                                    <label class="form-label" for="diem-su">Điểm môn Lịch sử:</label>
                                                    <input type="number" step="0.01" min="0" max="10" class="form-control" 
                                                           id="diem-su" name="lichSu" value="0">
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label" for="diem-dia">Điểm môn Địa lý:</label>
                                                    <input type="number" step="0.01" min="0" max="10" class="form-control" 
                                                           id="diem-dia" name="diaLy" value="0">
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label" for="diem-tin">Điểm môn Tin học:</label>
                                                    <input type="number" step="0.01" min="0" max="10" class="form-control" 
                                                           id="diem-tin" name="tinHoc" value="0">
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label" for="diem-ktpl">Điểm môn Giáo dục kinh tế & pháp luật:</label>
                                                    <input type="number" step="0.01" min="0" max="10" class="form-control" 
                                                           id="diem-ktpl" name="ktpl" value="0">
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label" for="diem-cn-cn">Điểm môn CN Công nghiệp:</label>
                                                    <input type="number" step="0.01" min="0" max="10" class="form-control" 
                                                           id="diem-cn-cn" name="cnCongNghiep" value="0">
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label" for="diem-cn-nn">Điểm môn CN Nông nghiệp:</label>
                                                    <input type="number" step="0.01" min="0" max="10" class="form-control" 
                                                           id="diem-cn-nn" name="cnNongNghiep" value="0">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Nút tính điểm -->
                                <div class="text-end mt-4 mb-4">
                                    <button type="submit" class="btn btn-hero btn-primary px-5">Tính điểm</button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- JS -->
        <script th:src="@{/js/jquery.min.js}"></script>
        <script th:src="@{/js/jquery.validate.min.js}"></script>
        <script th:src="@{/js/dashmix.app.min.js}"></script>

        <!-- Thay file validation cũ bằng file mới nếu cần -->
        <script th:src="@{/js/thpt_forms_validation.js}"></script>
    </body>
</html>
