<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

    <head th:replace="fragments/head :: head"></head>

    <body>
        <!-- Page Container -->
        <div id="page-container" class="page-header-dark main-content-boxed">

            <!-- Main Container -->
            <main id="main-container">

                <div th:replace="fragments/nav :: nav"></div>

                <!-- Page Content -->
                <div class="content">
                    <!-- Layouts -->
                    <div class="block block-rounded">
                        <div class="block-header block-header-default">
                            <h3 class="block-title">Thông tin thí sinh</h3>
                        </div>
                        <div class="block-content">
                            <!-- Grid Based Layout -->
                            <div class="row">
                                <!-- Hàng 1 -->
                                <div class="row mb-4">
                                    <div class="col-4">
                                        <label class="form-label">Anh (Chị)</label>
                                        <input type="text" class="form-control" value="Justin Bieber" readonly>
                                    </div>
                                    <div class="col-3">
                                        <label class="form-label">Ngày sinh</label>
                                        <input type="text" class="form-control" value="1/3/2007" readonly>
                                    </div>
                                    <div class="col-5">
                                        <label class="form-label">Số CCCD</label>
                                        <input type="text" class="form-control" value="TS_001" readonly>
                                    </div>
                                </div>

                                <!-- Hàng 2 -->
                                <div class="row mb-4">
                                    <div class="col-2">
                                        <label class="form-label">Đối tượng</label>
                                        <input type="text" class="form-control" value="0" readonly>
                                    </div>
                                    <div class="col-2">
                                        <label class="form-label">Khu vực</label>
                                        <input type="text" class="form-control" value="3" readonly>
                                    </div>
                                    <div class="col-8">
                                        <label class="form-label">Ngành</label>
                                        <input type="text" class="form-control" value="Sư phạm Hoá học (7140212)" readonly>
                                    </div>
                                </div>

                                <!-- Hàng 3 -->
                                <div class="row mb-4">
                                    <div class="col-4">
                                        <label class="form-label">Tổ hợp xét tuyển</label>
                                        <input type="text" class="form-control" value="A00 - Toán, Lí, Hoá" readonly>
                                    </div>
                                    <div class="col-4">
                                        <label class="form-label">Phương thức xét tuyển</label>
                                        <input type="text" class="form-control" value="THPT" readonly>
                                    </div>
                                    <div class="col-4">
                                        <label class="form-label">Điểm xét tuyển</label>
                                        <input type="text" class="form-control" value="18" readonly>
                                    </div>
                                </div>

                                <!-- Hàng 4 -->
                                <div class="row mb-4">
                                    <div class="col-4">
                                        <div class="form-floating">
                                            <input type="text" class="form-control" id="floatingCol1"
                                                   placeholder="Enter value" value="6" readonly>
                                            <label for="floatingCol1">Điểm môn 1</label>
                                        </div>
                                    </div>
                                    <div class="col-4">
                                        <div class="form-floating">
                                            <input type="text" class="form-control" id="floatingCol2"
                                                   placeholder="Enter value" value="6" readonly>
                                            <label for="floatingCol2">Điểm môn 2</label>
                                        </div>
                                    </div>
                                    <div class="col-4">
                                        <div class="form-floating">
                                            <input type="text" class="form-control" id="floatingCol3"
                                                   placeholder="Enter value" value="6" readonly>
                                            <label for="floatingCol3">Điểm môn 3</label>
                                        </div>
                                    </div>
                                </div>

                                <!-- Hàng 5 -->
                                <div class="row mb-4">
                                    <label class="col-sm-2 col-form-label" for="horizontal-grid-input">Kết quả</label>
                                    <div class="col-sm-4">
                                        <input type="text" class="form-control" id="horizontal-grid-input"
                                               style="border-left: 5px solid var(--bs-primary);"
                                               placeholder="Horizontal field" value="Trúng tuyển" readonly>
                                    </div>
                                </div>
                            </div>
                            <!-- END Grid Based Layout -->
                        </div>
                    </div>
                    <!-- END Layouts -->
                </div>
                <!-- END Page Content -->
            </main>
            <!-- END Main Container -->

        </div>
        <!-- END Page Container -->

    </body>

    <!-- JS -->
    <script th:src="@{/js/dashmix.app.min.js}"></script>
    <script th:src="@{/js/jquery.min.js}"></script>

</html>
